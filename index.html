<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>App Notification Demo</title>

  <!-- Thẻ bắt buộc để ẩn Safari trên iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThongBao">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1827/1827504.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"ThongBao","short_name":"ThongBao","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "33007f12-79f1-4b3b-919e-ee08f6bb4d1f",
      });
    });

    // Hàm phát thông báo bằng Service Worker gốc
    async function phatThongBao(title, message) {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification(title, {
          body: message,
          icon: "https://cdn-icons-png.flaticon.com/512/1827/1827504.png"
        });
      } else {
        new Notification(title, { body: message });
      }
    }

    // 1. Gửi 10 thông báo (1s/lần)
    function gui10ThongBao() {
      let count = 1;
      phatThongBao("Thông báo đếm số", `Lần gửi thứ ${count}/10`);

      const timer = setInterval(() => {
        count++;
        if (count <= 10) {
          phatThongBao("Thông báo đếm số", `Lần gửi thứ ${count}/10`);
        } else {
          clearInterval(timer);
        }
      }, 1000);
    }

    // 2. Hẹn giờ 3 giây
    function henGio3Giay() {
      phatThongBao("Hệ thống", "3 giây sau sẽ có thông báo...");
      setTimeout(() => {
        phatThongBao("Thử thành công", "Thử thành công!");
      }, 3000);
    }
  </script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
      --accent-green: #30d158;
      --accent-blue: #0a84ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 932px;
      background: rgba(18, 18, 20, 0.95);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
    }

    .seal-btn {
      font-size: 26px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .view-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }

    .view-content.active {
      display: flex;
    }

    .menu-view {
      align-items: center;
      justify-content: center;
    }

    .add-btn-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent-blue);
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-hint {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-sub);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      color: white;
    }

    .btn-10s { background-color: var(--accent-green); }
    .btn-3s { background-color: var(--accent-blue); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <div class="app-title" id="pageTitle">Menu</div>
      <button class="seal-btn" onclick="toggleMenu()">🦭</button>
    </div>

    <!-- VIEW 1: Menu Trang Chủ -->
    <div class="view-content menu-view active" id="menuView">
      <div class="add-btn-large" onclick="openStudio()">+</div>
      <div class="menu-hint">Bấm + để vào bảng điều khiển</div>
    </div>

    <!-- VIEW 2: Bảng Điều Khiển Gốc -->
    <div class="view-content" id="studioView">
      <p style="color: var(--text-sub); font-size: 14px;">Chọn tính năng bạn muốn thử nghiệm bên dưới:</p>
      
      <button class="btn btn-10s" onclick="gui10ThongBao()">Gửi 10 thông báo (1s/lần)</button>
      <button class="btn btn-3s" onclick="henGio3Giay()">Hẹn giờ thông báo 3 giây</button>
    </div>
  </div>

  <script>
    // Chống Safari nhảy tab PWA
    (function(a,b,c){if(c in b&&b[c]){var d,e=a.location,f=/^http/;a.addEventListener("click",function(a){d=a.target;while(d.nodeName!=="A"&&d.nodeName!=="BODY")d=d.parentNode;"href"in d&&(d.href.indexOf("http")||~d.href.indexOf(e.host))&&(a.preventDefault(),e.href=d.href)},!1)}})(document,window.navigator,"standalone");

    function toggleMenu() {
      const menuView = document.getElementById('menuView');
      if (menuView.classList.contains('active')) {
        openStudio();
      } else {
        document.getElementById('studioView').classList.remove('active');
        menuView.classList.add('active');
        document.getElementById('pageTitle').innerText = 'Menu';
      }
    }

    function openStudio() {
      document.getElementById('menuView').classList.remove('active');
      document.getElementById('studioView').classList.add('active');
      document.getElementById('pageTitle').innerText = 'Điều khiển Thông báo';
    }
  </script>
</body>
</html>
