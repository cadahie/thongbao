<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thông Báo Giả</title>

  <!-- Thẻ ẩn thanh công cụ Safari trên iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThongBao">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1827/1827504.png">
  <link rel="manifest" href='data:application/manifest+json,{"name":"ThongBao","short_name":"ThongBao","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 932px;
      background: rgba(18, 18, 20, 0.95);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
    }

    .seal-btn {
      font-size: 26px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .view-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }

    .view-content.active {
      display: flex;
    }

    .menu-view {
      align-items: center;
      justify-content: center;
    }

    .add-btn-large {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent-blue);
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-hint {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-sub);
    }

    .form-section {
      margin-bottom: 18px;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .app-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .app-card {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
    }

    .app-card span {
      font-size: 13px;
      color: var(--text-sub);
    }

    .app-card.selected {
      border-color: var(--accent-blue);
      background: rgba(10, 132, 255, 0.2);
    }

    .app-card.selected span {
      color: var(--text-main);
      font-weight: 600;
    }

    .input-group {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 12px;
      margin-bottom: 10px;
    }

    .input-group label {
      display: block;
      font-size: 10px;
      color: var(--text-sub);
    }

    .input-group input {
      width: 100%;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      padding: 4px 0;
      outline: none;
      user-select: text;
    }

    .row-inputs {
      display: flex;
      gap: 10px;
    }

    .row-inputs .input-group {
      flex: 1;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-danger { background: rgba(255, 69, 58, 0.2); color: var(--accent-red); border: 1px solid rgba(255, 69, 58, 0.3); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <div class="app-title" id="pageTitle">Menu</div>
      <button class="seal-btn" onclick="toggleMenu()">🦭</button>
    </div>

    <!-- VIEW 1: Menu -->
    <div class="view-content menu-view active" id="menuView">
      <div class="add-btn-large" onclick="openStudio()">+</div>
      <div class="menu-hint">Tạo thông báo giả mới</div>
    </div>

    <!-- VIEW 2: Cấu hình -->
    <div class="view-content" id="studioView">
      
      <div class="form-section">
        <div class="section-label">Tên ứng dụng hiển thị</div>
        <div class="app-selector">
          <div class="app-card selected" onclick="selectApp(this, 'Facebook')"><span>Facebook</span></div>
          <div class="app-card" onclick="selectApp(this, 'Messenger')"><span>Messenger</span></div>
          <div class="app-card" onclick="selectApp(this, 'Instagram')"><span>Instagram</span></div>
          <div class="app-card" onclick="selectApp(this, 'TikTok')"><span>TikTok</span></div>
          <div class="app-card" onclick="selectApp(this, 'Zalo')"><span>Zalo</span></div>
          <div class="app-card" onclick="selectApp(this, 'Discord')"><span>Discord</span></div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-label">Nội dung hiển thị</div>
        <div class="input-group">
          <label>Tên người gửi / Tiêu đề</label>
          <input type="text" id="senderInput" value="Crush">
        </div>
        <div class="input-group">
          <label>Nội dung tin nhắn</label>
          <input type="text" id="msgInput" value="Tối nay rảnh không, đi chơi nha! ❤️">
        </div>
      </div>

      <div class="form-section">
        <div class="section-label">Tần suất & Số lượng</div>
        <div class="row-inputs">
          <div class="input-group">
            <label>Tổng số lượt</label>
            <input type="number" id="countInput" value="3" min="1">
          </div>
          <div class="input-group">
            <label>Giãn cách (Giây)</label>
            <input type="number" id="intervalInput" value="2" min="0.5" step="0.5">
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="startFakeNotification()">Bắt đầu gửi</button>
      <button class="btn btn-danger" onclick="stopNotification()">Dừng lại</button>

    </div>
  </div>

  <script>
    // Chống Safari nhảy tab PWA
    (function(a,b,c){if(c in b&&b[c]){var d,e=a.location,f=/^http/;a.addEventListener("click",function(a){d=a.target;while(d.nodeName!=="A"&&d.nodeName!=="BODY")d=d.parentNode;"href"in d&&(d.href.indexOf("http")||~d.href.indexOf(e.host))&&(a.preventDefault(),e.href=d.href)},!1)}})(document,window.navigator,"standalone");

    let selectedAppName = 'Facebook';
    let timerId = null;

    function selectApp(element, appName) {
      document.querySelectorAll('.app-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedAppName = appName;
    }

    function toggleMenu() {
      const menuView = document.getElementById('menuView');
      if (menuView.classList.contains('active')) {
        openStudio();
      } else {
        document.getElementById('studioView').classList.remove('active');
        menuView.classList.add('active');
        document.getElementById('pageTitle').innerText = 'Menu';
      }
    }

    function openStudio() {
      document.getElementById('menuView').classList.remove('active');
      document.getElementById('studioView').classList.add('active');
      document.getElementById('pageTitle').innerText = 'Thông Báo Giả';
    }

    async function requestPermission() {
      if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        return perm === 'granted';
      }
      return false;
    }

    // Phát thông báo KHÔNG chứa icon
    function sendNotification(title, body) {
      new Notification(title, { body });
    }

    async function startFakeNotification() {
      const hasPerm = await requestPermission();
      if (!hasPerm) {
        alert("Bạn chưa cấp quyền Thông báo cho ứng dụng!");
        return;
      }

      const sender = document.getElementById('senderInput').value.trim() || selectedAppName;
      const message = document.getElementById('msgInput').value.trim() || 'Bạn có thông báo mới';
      const totalCount = parseInt(document.getElementById('countInput').value) || 1;
      const intervalSec = parseFloat(document.getElementById('intervalInput').value) || 1;

      // Tiêu đề dạng: "Messenger • Crush"
      const title = `${selectedAppName} • ${sender}`;

      if (timerId) clearInterval(timerId);

      let currentCount = 0;
      sendNotification(title, message);
      currentCount++;

      if (totalCount > 1) {
        timerId = setInterval(() => {
          if (currentCount < totalCount) {
            sendNotification(title, message);
            currentCount++;
          } else {
            clearInterval(timerId);
            timerId = null;
          }
        }, intervalSec * 1000);
      }
    }

    function stopNotification() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        alert('Đã dừng tiến trình!');
      }
    }
  </script>
</body>
</html>
